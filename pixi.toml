# Single definition of the environment, for every machine (personal
# computers and the UFSC JupyterHub server, which can't run containers).
# pixi.lock pins the exact version of every package, so `pixi install`
# gives everyone the same environment. See README.md.

[workspace]
name = "visao-computacional"
channels = ["conda-forge"]
# onnxruntime 1.31 publishes macOS wheels for 14.0+ only.
platforms = [
    "linux-64",
    { name = "osx-arm64-14", platform = "osx-arm64", macos = "14.0" },
    "win-64",
]

[dependencies]
python = "3.13.*"
# OCR engine, with every language model. Its Portuguese model is the same
# file as Ubuntu's tesseract-ocr-por (tessdata_fast).
tesseract = "5.5.*"

[pypi-dependencies]
huggingface_hub = "==2.2.0"
httpx = "==0.28.1"
matplotlib = "==3.11.2"
numpy = "==2.5.4"
onnxruntime = "==1.31.0"
# Headless only: rapidocr depends on it, and a second OpenCV package
# (opencv-python) would install the same cv2 module twice.
opencv-python-headless = "==5.0.0.93"
pandas = "==3.0.6"
pyarrow = "==25.0.1"
pytesseract = "==0.3.13"
pytest = "==8.4.2"
rapidocr = "==3.10.0"
scikit-learn = "==1.9.1"
seaborn = "==0.13.2"
tqdm = "==4.70.1"

[feature.dev.pypi-dependencies]
black = "==25.1.0"
pre-commit = "==4.2.0"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
web = { features = ["web"], solve-group = "default" }

[tasks]
download = "python src/ingestion/download_dataset.py"
pipeline = "python src/pipeline/data_pipeline.py"
test = "python -m pytest tests"
label = "python src/labeling/server.py"
compact-labels = "python src/labeling/labels.py --compact"
eval = "python src/evaluation/back.py"

[feature.dev.tasks]
hooks = "pre-commit install"

# The app (web/README.md). A separate environment so the default one, used
# by the pipelines and the evaluation runs, stays light.
[feature.web.pypi-dependencies]
fastapi = "==0.162.4"
# Form uploads (FastAPI's UploadFile).
python-multipart = "==0.0.33"
uvicorn = "==0.54.0"

[feature.web.tasks]
app = "uvicorn app.main:app --app-dir web --host 127.0.0.1 --port 8000"
test-web = "python -m pytest web/tests"
