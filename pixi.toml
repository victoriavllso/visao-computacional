# Single definition of the environment, for every machine (personal
# computers and the UFSC JupyterHub server, which can't run containers).
# pixi.lock pins the exact version of every package, so `pixi install`
# gives everyone the same environment. See README.md.

[workspace]
name = "visao-computacional"
channels = ["conda-forge"]
# onnxruntime 1.31 publishes macOS wheels for 14.0+ only.
platforms = [
    "linux-64",
    { name = "osx-arm64-14", platform = "osx-arm64", macos = "14.0" },
    "win-64",
]

[dependencies]
python = "3.13.*"
# OCR engine, with every language model. Its Portuguese model is the same
# file as Ubuntu's tesseract-ocr-por (tessdata_fast).
tesseract = "5.5.*"

[pypi-dependencies]
huggingface_hub = "==2.2.0"
httpx = "==0.28.1"
matplotlib = "==3.11.2"
numpy = "==2.5.4"
onnxruntime = "==1.31.0"
# Headless only: rapidocr depends on it, and a second OpenCV package
# (opencv-python) would install the same cv2 module twice.
opencv-python-headless = "==5.0.0.93"
pandas = "==3.0.6"
pyarrow = "==25.0.1"
pytesseract = "==0.3.13"
pytest = "==8.4.2"
rapidocr = "==3.10.0"
scikit-learn = "==1.9.1"
seaborn = "==0.13.2"
tqdm = "==4.70.1"

[feature.dev.pypi-dependencies]
black = "==25.1.0"
pre-commit = "==4.2.0"

# Training the warning panel detector (src/training/front_detector.py):
# ultralytics + torch (CUDA wheels), several GB, so in an environment of
# its own; the default environment runs the trained model on ONNX Runtime.
# The headless build of ultralytics, so there is a single OpenCV (as above).
[feature.detector]
platforms = ["linux-64"]

[feature.detector.pypi-dependencies]
ultralytics-opencv-headless = "==8.4.192"
torch = "==2.14.1"
torchvision = "==0.29.1"
# ONNX export (ultralytics would otherwise pip-install them at export).
onnx = "==1.23.2"
onnxslim = "==0.1.98"

[feature.detector.tasks]
train-detector = "python src/training/front_detector.py"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
# Own solve group: its packages don't move the default environment's pins.
detector = { features = ["detector"] }

[tasks]
download = "python src/ingestion/download_dataset.py"
pipeline = "python src/pipeline/data_pipeline.py"
test = "python -m pytest tests"
label = "python src/labeling/server.py"
compact-labels = "python src/labeling/labels.py --compact"
eval = "python src/evaluation/back.py"
eval-front = "python src/evaluation/front.py"

[feature.dev.tasks]
hooks = "pre-commit install"
